[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    integration: Integration tests that may require network access
    slow: Slow tests that take more than a few seconds
    unit: Fast unit tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = .git .cache __pycache__ *.egg-info build dist
